
<header class="details">
    <h1>Contact Us</h1>
</header>
<section>
    <div class="box contact">
        <div class="form">
            <form [formGroup]="contactForm" (ngSubmit)="sendContactMail()">
                <h2>Get In <span>Touch</span></h2>
                <div>
                    <label for="name" *ngIf="!nameInp.value.length">Name</label>
                    <input #nameInp type="text" id="name" formControlName="name">
                </div>
                <div>
                    <label for="company" *ngIf="!companyInp.value.length">Company</label>
                    <input #companyInp type="text" id="company" formControlName="company">
                </div>
                <div>
                    <label for="email" *ngIf="!emailInp.value.length">Email</label>
                    <input #emailInp type="text" id="email" formControlName="email">
                </div>
                <div>
                    <label for="message" *ngIf="!messageText.value.length">Message</label>
                    <textarea #messageText class="message" type="text" id="message" formControlName="message"></textarea>
                </div>

                <button>SEND</button>
            </form>
        </div>
         
        <div class="location">
            <div id="map"></div>
        </div>

        <div class="background"></div>
    </div>
    <div class="polygon"></div>
    
</section>
