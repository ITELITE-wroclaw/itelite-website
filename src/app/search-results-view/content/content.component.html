<div *ngIf="searchResults" class="searchResults box" (click)="appService.navigateIntoView($event)">
    <div *ngIf="searchResults[0].length">
        <h2>Antennas</h2>
        <div>
            <div #searchLi *ngFor="let e of searchResults[0]" [attr.data-search]="JSON.stringify({component: 'antenna_'+e.ant_name})">
                
                    <div [attr.data-search]="JSON.stringify({component: 'antenna_'+e.ant_name})">
                        <figcaption [attr.data-search]="JSON.stringify({component: 'antenna_'+e.ant_name})">
                            <img [attr.data-search]="JSON.stringify({component: 'antenna_'+e.ant_name})" [src]="e.guid" alt="Antenna photo." role="Icon which presents antenna image.">
                            <div class="properties">
                                <p [attr.data-search]="JSON.stringify({component: 'antenna_'+e.ant_name})">{{e.ant_name}}</p>
                                <span [attr.data-search]="JSON.stringify({component: 'antenna_'+e.ant_name})">{{e.freq_name}}</span>
                                <span [attr.data-search]="JSON.stringify({component: 'antenna_'+e.ant_name})">{{e.ant_type}}</span>
                                <span [attr.data-search]="JSON.stringify({component: 'antenna_'+e.ant_name})">{{e.feature}}</span>
                            </div>
                        </figcaption>
                    </div>
                <ng-template #emptyList>
                    <p>There is no results.</p>
                </ng-template>
            </div>
            
        </div>
    </div>
    <div *ngIf="searchResults[1].length">
        <h2>Website sections</h2>
        <div>
            
            <div *ngFor="let e of searchResults[1]" [attr.data-search]="JSON.stringify({component: e?.text, id: e?.id, value: e?.data})">
                <p [attr.data-search]="JSON.stringify({component: e?.text, id: e?.id, value: e?.data})">{{e.text}} / {{e.path}}</p>
            </div>
        </div>
    </div>
    
        
</div>

<ng-template>
    <div class="empty">

    </div>
</ng-template>
